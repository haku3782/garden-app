spring:
  application:
    name: garden-app
  config:
    # ローカル専用設定ファイルを読み込む（存在しない場合はスキップ）
    # application.local.yaml で DB 接続情報を上書きすることで
    # 起動時に環境変数をセットする手間をなくす
    import: "optional:classpath:application.local.yaml"
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[format_sql]": true
  flyway:
    # 既存スキーマ（手動作成済み）をV1として既に適用済み扱いにする
    # → V1__baseline.sql は実行されず、以後のV2以降のみが実行される
    baseline-on-migrate: true
  servlet:
    multipart:
      # ケア記録写真アップロードの上限（Supabase Storageバケット側の制限と合わせる）
      max-file-size: 5MB
      max-request-size: 5MB

app:
  flyway:
    # Flywayマイグレーション専用の接続先（セッションプーリング、ポート5432）
    # spring.datasource.url（アプリ本体用、トランザクションプーリング）とは別にする
    url: ${FLYWAY_DATABASE_URL}

jwt:
  # 本番環境では環境変数 JWT_SECRET に強力なランダム文字列を設定すること
  # ローカルでは application.local.yaml で上書きされる
  secret: ${JWT_SECRET}

supabase:
  # Supabase Storage への画像アップロードに使用（service_role相当のsecret key）
  # 本番では環境変数、ローカルでは application.local.yaml で設定する
  url: ${SUPABASE_URL}
  secret-key: ${SUPABASE_SECRET_KEY}
  bucket: care-log-photos

server:
  port: ${PORT:8081}
