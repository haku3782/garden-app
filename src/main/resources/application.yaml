spring:
  application:
    name: garden-app
  config:
    # ローカル専用設定ファイルを読み込む（存在しない場合はスキップ）
    # application.local.yaml で DB 接続情報を上書きすることで
    # 起動時に環境変数をセットする手間をなくす
    import: "optional:classpath:application.local.yaml"
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[format_sql]": true

jwt:
  # 本番環境では環境変数 JWT_SECRET に強力なランダム文字列を設定すること
  # ローカルでは application.local.yaml で上書きされる
  secret: ${JWT_SECRET}

server:
  port: 8081
